<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        html, 
        body{
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #box {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        input,
        button {
            border: solid 1px black;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        #bntlogin {
            width: 173px;
        }

        body {
            background-image: url("Logo_medicina.jpg");
            background-size: cover;
            background-repeat: no-repeat;
        }

    </style>

    <script>
      async function cadastrar(event) {
         event.preventDefault();

         var usuario = document.getElementById("usuario").value.trim();
         var nome = document.getElementById("nome").value.trim();
         var senha = document.getElementById("senha").value;

         if (usuario === "" || nome === "" || senha === "") {
            alert("Preencha o usuário, o nome e a senha para concluir o cadastro.");
            return;
         }

         try {
            var url = "/cadastrar/"
               + encodeURIComponent(usuario) + "/"
               + encodeURIComponent(nome) + "/"
               + encodeURIComponent(senha);
            var resposta = await fetch(url);

            if (!resposta.ok) {
               alert("Não foi possível concluir o cadastro.");
               return;
            }

            alert("Cadastro realizado com sucesso!");
            window.location.href = "index.html";
         } catch (error) {
            console.error(error);
            alert("Não foi possível conectar ao servidor. Tente novamente.");
         }
      }
    </script>
</head>
<body>
    <div id="box">

        <form onsubmit="cadastrar(event)">
            <input id="usuario" type="text" placeholder="usuário" required>
            <input id="nome" type="text" placeholder="nome" required>
            <input id="senha" type="password" placeholder="senha" required>
            <button id="bntlogin" type="submit">cadastrar</button>
        </form>

    </div>
</body>
</html>
